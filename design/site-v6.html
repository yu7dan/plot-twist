<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<title>Plot Twist — site v6 (visual draft)</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="site-v6.css" />
<script src="brand.js"></script>
</head>
<body>
<div id="root"></div>
<div class="rbar" id="rbar"></div>
<script>
const A = "../public/assets/", T = A + "tokens/";
const S = { theme: "dark", bg: "cast", tab: "gift", designed: true, menu: false };
const kite = `<span class="brand">${BRAND.kite}</span>`;
const ic = {
  gift: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5C10 3 12 8 12 8s2-5 4.5-5a2.5 2.5 0 0 1 0 5"/></svg>',
  drop: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
  api: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4M8 16h.01M16 16h.01"/></svg>',
  chev: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>',
  spark: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.9 6.1L20 10l-6.1 1.9L12 18l-1.9-6.1L4 10l6.1-1.9z"/></svg>',
  gear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68 1.65 1.65 0 0 0 10 3.17V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>',
  sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
  copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2.5"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>',
  plug: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2v6M15 2v6M6 8h12v4a6 6 0 0 1-12 0zM12 18v4"/></svg>',
  term: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m4 17 6-6-6-6M12 19h8"/></svg>',
  fn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H7a2 2 0 0 0-2 2v5a2 2 0 0 1-2 2 2 2 0 0 1 2 2v5a2 2 0 0 0 2 2h1M16 3h1a2 2 0 0 1 2 2v5a2 2 0 0 0 2 2 2 2 0 0 0-2 2v5a2 2 0 0 1-2 2h-1"/></svg>',
  right: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
};
const pi = (k) => `<span class="pi ${k}">${ic[k]}</span>`;
const tok = (label = "USDC") => `<span class="tok"><span class="net"><img src="${T}usdc.svg" alt=""><img class="c" src="${T}chain_base.png" alt=""></span>${label}${ic.chev}</span>`;
const NETS = ["chain_base.png", "chain_sol.png", "chain_polygon.png", "chain_avax.png", "arc_256.png", "tempo_touch.png", "rh_152.png"];

function nav() {
  return `<header class="nav" id="nav">
    <div class="nav-l">
      <a class="logo"><img src="${A}logo-head.png" alt="">Plot Twist</a>
      <div class="mi ${S.menu ? "open" : ""}" id="prodMenu"><button>Products ${ic.chev}</button>
        <div class="dd">
          <a data-tab="gift">${pi("gift")}<span><b>Gift</b><span class="d">One person, one gift link</span></span></a>
          <a data-tab="drop">${pi("drop")}<span><b>Drop</b><span class="d">Pay a whole list in one approval</span></span></a>
          <a data-tab="api">${pi("api")}<span><b>Agent API</b><span class="d">Let your AI agent send for you</span></span></a>
        </div>
      </div>
      <div class="mi"><a>Dashboard</a></div>
      <div class="mi"><a>Docs</a></div>
    </div>
    <div class="nav-r">
      <button class="icon-btn" id="themeBtn" title="Theme">${S.theme === "dark" ? ic.sun : ic.moon}</button>
      <a class="kite-cta">${kite}Connect Kite</a>
    </div>
  </header>`;
}

/* ---------- the three panels ---------- */
function giftPanel() {
  if (!S.designed) return `
    <div class="mod"><div class="lbl">Describe the gift</div>
      <div class="prompt ph">Birthday gift for my sister Maya, about $50 — she just moved to Berlin</div>
      <div class="mrow"><div class="mini-chips"><span>Birthday</span><span>Red packet 红包</span><span>Thank you</span></div></div>
    </div>
    <div class="link-btn"><span>${ic.spark}</span></div>
    <div class="mod out"><div class="lbl">They receive</div>
      <div class="split"><div><div class="big ph">$0</div><div class="sub">SERV fills this in</div></div>${tok()}</div>
    </div>
    <button class="cta soft">Design gift</button>`;
  return `
    <div class="mod"><div class="lbl">Describe the gift <span class="serv">${ic.spark}Designed by SERV</span></div>
      <div class="prompt sm">Birthday gift for my sister Maya, about $50 — she just moved to Berlin</div>
    </div>
    <div class="link-btn"><span>${ic.spark}</span></div>
    <div class="mod out"><div class="lbl"><span><b>Maya</b> receives</span><span class="mini-chips"><span>Birthday</span></span></div>
      <div class="split"><div><div class="big num">$50.00</div><div class="sub">50.00 USDC on Base</div></div>${tok()}</div>
      <div class="note">“New city, same you. Your first coffee in Berlin is on me — happy birthday!”</div>
    </div>
    <div class="meta-line"><span>You pay <b class="num">$50.75</b> · fee $0.75</span><span>Claim within <b>24h</b> ▾</span></div>
    <button class="cta">${kite}Send with Kite</button>`;
}
function dropPanel() {
  const rows = [["A", "alice.eth", "Discord", 40], ["B", "bob", "GitHub", 25]];
  return `
    <div class="mod"><div class="lbl"><span>Who’s getting paid? · <b>paste a list or CSV</b></span><span class="serv">${ic.spark}Table by SERV</span></div>
      <div class="prompt sm">Thank our top 5 contributors this month — alice.eth 40, bob 25, chen_dev 25, mira 25, sam.sol 15</div>
    </div>
    <div class="link-btn"><span>${ic.spark}</span></div>
    <div class="mod out"><div class="lbl"><span><b>5 people</b> · a link and a note each</span></div>
      <div class="split"><div><div class="big num">$130.00</div><div class="sub">130.00 USDC on Base</div></div>${tok()}</div>
      <div class="rows">${rows.map(([i, n, c, a]) => `<div class="rw"><span class="av">${i}</span><span class="nm">${n}</span><span class="ct">${c}</span><span class="am num">$${a}.00</span></div>`).join("")}<div class="rw more">+ 3 more · review the notes</div></div>
    </div>
    <div class="meta-line"><span>You pay <b class="num">$131.30</b> · fee 1%</span><span>Claim within <b>7d</b> ▾</span></div>
    <button class="cta">${kite}Approve $131.30 with Kite</button>`;
}
function apiPanel() {
  return `
    <div class="mod"><div class="lbl">Connect your agent</div>
      <div class="conn">
        <div class="cb"><span class="lg">${ic.plug}</span><span><b>MCP server</b><small>Claude, Cursor and any MCP client</small></span><span class="act">${ic.copy}Copy config</span></div>
        <div class="cb"><span class="lg">${ic.term}</span><span><b>REST API</b><small>One call creates a Gift or a Drop</small></span><span class="act">${ic.copy}Copy curl</span></div>
        <div class="cb"><span class="lg">${ic.fn}</span><span><b>Function calling</b><small>OpenAI, Gemini and others</small></span><span class="act">${ic.copy}Copy schema</span></div>
      </div>
      <div class="code"><span class="c-c">MCP</span>  <span class="c-s">https://plot-twist-zeta.vercel.app/mcp</span></div>
      <p class="fine">Your agent prepares Gifts and Drops. Every payment still waits for your Kite passkey — the agent never holds your money.</p>
    </div>
    <button class="cta">Create an API key</button>`;
}

function bg() {
  if (S.bg === "ribbon") {
    const sp = [[18, 30, 22], [80, 24, 16], [12, 70, 14], [88, 64, 24], [30, 88, 12], [70, 86, 18]];
    return `<div class="bg ribbon"><div class="glow"></div><div class="rb v"></div><div class="rb h"></div>
      ${sp.map(([x, y, s]) => `<span class="spk" style="left:${x}%;top:${y}%;width:${s}px;height:${s}px">${ic.spark}</span>`).join("")}</div>`;
  }
  const cast = [["m-happy", 8, 22, 130, ""], ["m-wink", 82, 16, 120, ""], ["m-cute", 20, 62, 84, "mid"], ["m-sparkle", 74, 58, 96, "mid"], ["m-secret", 4, 84, 70, "far"], ["m-surprise", 90, 82, 76, "far"], ["m-claimed", 32, 12, 56, "far"], ["m-happy", 64, 10, 52, "far"]];
  return `<div class="bg cast">${cast.map(([f, x, y, w, d], i) => `<img class="${d}" src="${A}${f}.png" style="left:${x}%;top:${y}%;width:${w}px;animation-delay:${-i * 1.3}s" alt="">`).join("")}</div>`;
}

function page() {
  const panels = { gift: giftPanel, drop: dropPanel, api: apiPanel };
  const tabs = [["gift", "Gift"], ["drop", "Drop"], ["api", "Agent API"]];
  return `${nav()}
  <section class="hero">${bg()}
    <h1>Send money<br><em>like a gift.</em></h1>
    <div class="panel">
      ${S.bg === "ribbon" ? `<img class="bow" src="${A}logo-head.png" alt="">` : ""}
      <div class="tabs">${tabs.map(([k, l]) => `<button data-tab="${k}" class="${S.tab === k ? "on" : ""}">${l}</button>`).join("")}<span class="sp"></span><span class="tool">${ic.gear}</span></div>
      ${panels[S.tab]()}
    </div>
    <p class="under">USDC on <span class="nets">${NETS.map((f) => `<img src="${T}${f}" alt="">`).join("")}</span> 7 networks. Claimed with any wallet<br>or exchange address — <a>gas is on us</a>.</p>
  </section>

  <section class="sec">
    <h2>Built for every way you give.</h2>
    <p class="lead">One person, a whole community, or your AI agent — the same describe, approve, claim flow.</p>
    <div class="cards3">
      <div class="pcard gift"><span class="kick">${ic.gift}Gift</span><h3>A gift link for someone you care about.</h3><p>SERV designs it from one sentence and writes the note. It stays sealed until they reveal it.</p><a class="go">Send a gift ${ic.right}</a><img class="art" src="${A}m-secret.png" alt=""></div>
      <div class="pcard drop"><span class="kick">${ic.drop}Drop</span><h3>Pay a whole list with one approval.</h3><p>Rewards, bounties, prizes and research incentives. Everyone gets their own link and note.</p><a class="go">Start a Drop ${ic.right}</a><img class="art" src="${A}m-happy.png" alt=""></div>
      <div class="pcard api"><span class="kick">${ic.api}Agent API</span><h3>Let your agent pay people.</h3><p>MCP, REST or function calling. Your agent prepares it; you approve with your Kite passkey.</p><a class="go">Connect an agent ${ic.right}</a><img class="art" src="${A}m-sparkle.png" alt=""></div>
    </div>
  </section>

  <section class="sec">
    <h2>Describe it. Approve once. They claim.</h2>
    <div class="steps">
      <div class="step"><div class="n">01</div><b>Describe it</b><p>A sentence, a pasted list or an API call. SERV works out who, how much and the occasion, and writes every note.</p></div>
      <div class="step"><div class="n">02</div><b>Approve once on Kite</b><p>Kite Passport shows the exact total. One passkey tap pays for a gift or a whole Drop. We never hold your keys.</p></div>
      <div class="step"><div class="n">03</div><b>They claim</b><p>Each person opens their link and claims to a wallet or an exchange address. No sign-up, no gas.</p></div>
    </div>
  </section>

  <section class="sec">
    <h2>The AI writes. You approve. The chain proves it.</h2>
    <div class="trust">
      <div><b>Passkey on every payment</b><p>Nothing moves until you approve the exact total on Kite.</p></div>
      <div><b>Verified on-chain</b><p>Every payment and claim is a public transaction.</p></div>
      <div><b>Take it back</b><p>Not claimed in the window you chose? It comes back to you.</p></div>
      <div><b>Stable value</b><p>USDC and USDG are dollar stablecoins. $50 stays $50.</p></div>
    </div>
    <div class="built">Built with <span class="w">${kite}Kite Passport</span><span class="w os"><span class="brand" style="width:110px;height:26px">${BRAND.openserv}</span></span></div>
  </section>

  <footer class="foot"><div class="foot-in">
    <div><a class="logo"><img src="${A}logo-head.png" alt="">Plot Twist</a><p>Send money like a gift — to one person, a whole list, or through your AI agent.</p></div>
    <div><h5>Products</h5><a>Gift</a><a>Drop</a><a>Agent API</a></div>
    <div><h5>Resources</h5><a>Docs</a><a>GitHub</a></div>
    <div><h5>Built with</h5><a>Kite Passport</a><a>SERV Reasoning</a><a>USDC · USDG</a></div>
  </div></footer>`;
}

function bar() {
  const b = (k, v, l) => `<button data-set="${k}" data-val="${v}" class="${String(S[k]) === String(v) ? "on" : ""}">${l}</button>`;
  return `<small>Theme</small>${b("theme", "dark", "Dark")}${b("theme", "light", "Light")}<i></i>
    <small>Panel</small>${b("tab", "gift", "Gift")}${b("tab", "drop", "Drop")}${b("tab", "api", "Agent API")}<i></i>
    ${b("designed", "false", "Gift: empty")}${b("menu", "true", "Products menu")}`;
}

function render() {
  document.documentElement.dataset.theme = S.theme;
  document.getElementById("root").innerHTML = page();
  document.getElementById("rbar").innerHTML = bar();
  document.querySelectorAll("[data-tab]").forEach((el) => el.onclick = () => { S.tab = el.dataset.tab; S.menu = false; render(); });
  document.querySelector("#prodMenu > button").onclick = (e) => { e.stopPropagation(); S.menu = !S.menu; render(); };
  document.getElementById("themeBtn").onclick = () => { S.theme = S.theme === "dark" ? "light" : "dark"; render(); };
  document.querySelectorAll("[data-set]").forEach((el) => el.onclick = () => {
    const k = el.dataset.set, v = el.dataset.val;
    if (k === "designed" || k === "menu") S[k] = String(S[k]) === v ? !(v === "true") : v === "true";
    else S[k] = v;
    if (k === "designed") S.tab = "gift";
    render();
  });
  onScroll();
}
function onScroll() { document.getElementById("nav")?.classList.toggle("glass", scrollY > 8); }
addEventListener("scroll", onScroll);
document.addEventListener("click", (e) => { if (S.menu && !e.target.closest(".dd") && !e.target.closest(".rbar")) { S.menu = false; render(); } });
const q = new URLSearchParams(location.hash.slice(1));
for (const [k, v] of q) S[k] = v === "true" ? true : v === "false" ? false : v;
render();
</script>
</body>
</html>
