<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<title>Plot Twist — v7 draft: Drop table + Dashboard developers</title>
<link rel="stylesheet" href="site-v6.css" />
<link rel="stylesheet" href="v7.css" />
<script src="brand.js"></script>
</head>
<body>
<div id="root"></div>
<div class="rbar" id="rbar"></div>
<script>
const A = "../public/assets/", T = A + "tokens/";
const S = { theme: "dark", screen: "drop" };
const kite = `<span class="brand">${BRAND.kite}</span>`;
const ic = {
  chev: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>',
  spark: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.9 6.1L20 10l-6.1 1.9L12 18l-1.9-6.1L4 10l6.1-1.9z"/></svg>',
  pen: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>',
  copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2.5"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  warn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>',
  user: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
  code: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 18 6-6-6-6M8 6l-6 6 6 6"/></svg>',
  sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  ext: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg>',
};
const tok = `<span class="tok"><span class="net"><img src="${T}usdc.svg" alt=""><img class="c" src="${T}chain_base.png" alt=""></span>USDC${ic.chev}</span>`;
const nav = (on) => `<header class="nav glass"><div class="nav-l"><a class="logo"><img src="${A}logo-head.png" alt="">Plot Twist</a>
  <div class="mi"><button>Products ${ic.chev}</button></div><div class="mi"><a class="${on === "dash" ? "on" : ""}">Dashboard</a></div><div class="mi"><a>Docs</a></div></div>
  <div class="nav-r"><button class="icon-btn">${ic.sun}</button><a class="kite-cta" style="background:var(--s2);color:var(--text);border:1px solid var(--line2)">${kite}Kite · $254.30</a></div></header>`;

/* ---------- 1. Drop table ---------- */
const ROWS = [["A", "alice.eth", "@alice", "40.00", "Thanks for rewriting the docs and making them clearer for everyone."], ["B", "bob", "GitHub", "25.00", "Thanks for the three bug fixes that improved the project."], ["C", "chen_dev", "", "25.00", "Thanks for your first PR and getting involved so quickly."], ["M", "mira", "Discord", "25.00", "Thanks for helping newcomers feel welcome and supported."]];
function dropScreen(editTitle) {
  const row = ([a, n, c, amt, note], i) => {
    const amount = i === 1 && !editTitle
      ? `<span class="dt-amt-in"><span>$</span><input value="25"></span>`
      : `<span class="dt-amt ${i === 0 && !editTitle ? "hover" : ""}">$${amt}</span>`;
    return `<div class="dt-row"><span class="av">${a}</span><span><span class="nm">${n}</span>${c ? `<span class="ct">${c}</span>` : ""}<span class="nt">“${note}”</span></span>${amount}<button class="dt-rm ${i === 0 && !editTitle ? "show" : ""}">${ic.x}</button></div>`;
  };
  return `${nav()}
  <section class="hero" style="min-height:auto;padding-top:100px"><div class="bg cast"></div>
    <div class="panel" style="margin-top:0">
      <div class="tabs"><button>Gift</button><button class="on">Drop</button><button>Agent API</button></div>
      <div class="mod"><div class="lbl">Who’s getting paid? <span class="serv">${ic.spark}Table by SERV</span></div>
        <div class="prompt sm" style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">Thank our top 5 contributors this month — alice.eth 40 (rewrote the docs), bob 25 (three bug fixes), chen_dev 25 (first PR), mira 25 (helped newcomers), sam.sol 15</div></div>
      <div class="link-btn"><span>${ic.spark}</span></div>
      <div class="mod out" style="position:relative">
        <div class="dt-head">
          ${editTitle ? `<input class="dt-title-in" value="Top contributors · November">` : `<span class="dt-title">Top contributors · November${ic.pen}</span>`}
          <span class="dt-count">5 people</span>
        </div>
        <div class="split"><div><div class="big num">$130.00</div><div class="sub">Kite balance 254.30 USDC</div></div>${tok}</div>
        <div class="dt-rows">${ROWS.map(row).join("")}<button class="dt-more">+ 1 more · review every note</button></div>
        ${editTitle ? `<span class="callout" style="left:270px;top:-12px">editing the title</span>` : `<span class="callout" style="right:-112px;top:200px">hover: amount + remove</span><span class="callout" style="right:-90px;top:276px">editing amount</span>`}
      </div>
      <div class="meta-line"><span>You pay <b class="num">$131.30</b> · fee $1.30</span><span>Claim within <b>7d</b> ▾</span></div>
      <button class="cta">${kite}Approve $131.30 with Kite</button>
    </div>
  </section>`;
}

/* ---------- 2. Dashboard ---------- */
const head = (level) => `<div class="dh"><h1>Dashboard</h1><div class="acts">${level === "dev" ? `<a class="btn2">Docs ${ic.ext}</a><a class="btn2 acc" data-go="key1">${ic.plus}Create API key</a>` : `<a class="btn2">New Drop</a><a class="btn2 acc">New Gift</a>`}</div></div>
  <div class="level1"><button class="${level === "act" ? "on" : ""}" data-go="act">${ic.user}Activity</button><button class="${level === "dev" ? "on" : ""}" data-go="dev">${ic.code}Developers <span class="new">API</span></button></div>`;

function activity() {
  return `${nav("dash")}<div class="page">${head("act")}
    <div class="card acct">${kite}<div><b>kai@plottwist.gift</b><br><small>Kite Passport</small></div><div class="bal"><small>Balance</small><b class="num">$254.30</b></div><a class="btn2 acc">Add funds</a><a class="btn2">Withdraw</a></div>
    <div class="level2"><span>Gifts<em>4</em></span><span class="on">Drops<em>2</em></span><span>Received<em>1</em></span></div>
    <div class="card" style="margin-top:12px">
      <div class="row-li"><span class="av">TC</span><div><b>Top contributors · November</b><small>Base · 3 of 5 claimed · 4d left</small></div><div class="r"><b class="num">$130.00</b></div><span class="st wait">Live</span></div>
      <div class="row-li"><span class="av">SP</span><div><b>Survey participants · Round 2</b><small>Solana · 27 of 30 claimed · window ended</small></div><div class="r"><b class="num">$300.00</b></div><span class="st back">Take back $30.00</span></div>
    </div></div>`;
}

const DAYS = Array.from({ length: 30 }, (_, i) => { const a = Math.round(18 + 30 * Math.abs(Math.sin(i * 0.5)) + i * 1.4); return [a, Math.round(a * (0.18 + 0.1 * Math.abs(Math.cos(i))))]; });
function developers() {
  const max = Math.max(...DAYS.map(([a]) => a));
  const bars = DAYS.map(([a, b], i) => `<div class="col ${i === 23 ? "hl" : ""}"><i class="b" style="height:${(b / max) * 100}%"></i><i class="a" style="height:${((a - b) / max) * 100}%"></i></div>`).join("");
  const spark = (seed) => `<span class="spark">${Array.from({ length: 10 }, (_, i) => `<i style="height:${6 + Math.abs(Math.sin(i + seed)) * 14}px"></i>`).join("")}</span>`;
  return `${nav("dash")}<div class="page">${head("dev")}
    <div class="dev-h"><p>Agents use these keys to prepare Gifts and Drops for you. Every payment still waits for your passkey. <a>Read the docs →</a></p><span class="range"><span>7d</span><span class="on">30d</span><span>90d</span></span></div>
    <div class="grid4">
      <div class="kpi"><small>API requests</small><b class="num">1,284</b><span class="up">+18% vs last 30d</span></div>
      <div class="kpi"><small>Prepared by agents</small><b class="num">46</b><span>38 Gifts · 8 Drops</span></div>
      <div class="kpi"><small>Approved by you</small><b class="num">41</b><span>89% approval rate</span></div>
      <div class="kpi"><small>Volume via API</small><b class="num">$3,420</b><span>$41.20 in fees</span></div>
    </div>
    <div class="card">
      <div class="chart-h"><span>Requests per day</span><span class="legend"><span><i style="background:var(--accent)"></i>Gifts & Drops prepared</span><span><i style="background:var(--s3)"></i>Status checks</span></span></div>
      <div class="chart">${bars}<div class="tip" style="left:71%;top:-6px"><b>Nov 3</b><br>64 requests · 13 prepared</div></div>
      <div class="xaxis"><span>Oct 10</span><span>Oct 17</span><span>Oct 24</span><span>Oct 31</span><span>Nov 8</span></div>
    </div>
    <div class="card">
      <div class="sec-h">API keys <span style="font-size:12.5px;font-weight:500;color:var(--muted)">2 of 10</span></div>
      <table class="tbl"><thead><tr><th>Name</th><th>Key</th><th>Last 30 days</th><th class="num">Requests</th><th class="num">Prepared</th><th class="num">Approved volume</th><th>Last used</th><th></th></tr></thead><tbody>
        <tr><td><b>Birthday agent</b><small>Created Oct 12</small></td><td><code>pt_live_K0Gs…</code></td><td>${spark(1)}</td><td class="num">904</td><td class="num">31</td><td class="num">$1,640</td><td>2 min ago</td><td><span class="mini-btn warn">Revoke</span></td></tr>
        <tr><td><b>Community bot</b><small>Created Oct 28</small></td><td><code>pt_live_9xPa…</code></td><td>${spark(4)}</td><td class="num">380</td><td class="num">15</td><td class="num">$1,780</td><td>Yesterday</td><td><span class="mini-btn warn">Revoke</span></td></tr>
      </tbody></table>
      <p class="price-note">No charge for API calls. You pay the usual fee on what you send — 1.5% per Gift, 1% per Drop recipient — only after you approve it.</p>
    </div>
    <div class="card">
      <div class="sec-h">Recent requests <a>View all</a></div>
      <div class="row-li"><span class="av">G</span><div><b>Gift for Maya · $50.00</b><small>Birthday agent · 2 min ago</small></div><span class="st pend" style="margin-left:auto">Waiting for you</span><span class="mini-btn">Review</span></div>
      <div class="row-li"><span class="av">D</span><div><b>Top contributors · 5 people · $130.00</b><small>Community bot · yesterday</small></div><span class="st ok" style="margin-left:auto">Paid · live</span><span class="mini-btn">Open</span></div>
      <div class="row-li"><span class="av">G</span><div><b>Gift for Leo · $25.00</b><small>Birthday agent · Nov 6</small></div><span class="st ok" style="margin-left:auto">Claimed</span><span class="mini-btn">Open</span></div>
    </div></div>`;
}

function keyModal(step) {
  let body;
  if (step === 1) body = `<div class="mh">Create API key<span class="x">${ic.x}</span></div>
    <p>Give your agent its own key, so you can see its usage and revoke it on its own.</p>
    <label>Name</label><input value="Birthday agent">
    <div class="perm"><div>${ic.check}Can prepare Gifts and Drops and check their status</div><div class="no">${ic.warn}Can’t move money — you approve every payment with your Kite passkey</div></div>
    <button class="cta" data-go="key2">Create key</button>`;
  else body = `<div class="mh">Your new API key<span class="x" style="opacity:.35">${ic.x}</span></div>
    <p>Copy it into your agent now.</p>
    <div class="keybox"><code>pt_live_K0GsZ3x9Qm2bWvR7tLpY4nHc8dJfA1eQ</code><button class="copy ${step === 3 ? "done" : ""}" data-go="key3">${step === 3 ? ic.check + "Copied" : ic.copy + "Copy key"}</button></div>
    <div class="warnline">${ic.warn}<span>This is the only time you’ll see it. We only keep a fingerprint, so a lost key can’t be recovered — create a new one instead.</span></div>
    <button class="cta ${step === 3 ? "" : "off"}" data-go="dev">I’ve saved my key</button>
    <p class="cta-sub">${step === 3 ? "Closing hides the key for good." : "Copy the key first."}</p>`;
  return developers() + `<div class="scrim"><div class="modal">${body}</div></div>`;
}

const SCREENS = { drop: () => dropScreen(false), droptitle: () => dropScreen(true), act: activity, dev: developers, key1: () => keyModal(1), key2: () => keyModal(2), key3: () => keyModal(3) };
const LABELS = [["drop", "Drop table"], ["droptitle", "Drop: edit title"], null, ["act", "Dashboard · Activity"], ["dev", "Dashboard · Developers"], null, ["key1", "Create key 1/2"], ["key2", "Create key 2/2"], ["key3", "Copied"]];
function render() {
  document.documentElement.dataset.theme = S.theme;
  document.getElementById("root").innerHTML = SCREENS[S.screen]();
  document.getElementById("rbar").innerHTML = `<button data-theme-set="dark" class="${S.theme === "dark" ? "on" : ""}">Dark</button><button data-theme-set="light" class="${S.theme === "light" ? "on" : ""}">Light</button><i></i>` +
    LABELS.map((l) => (l ? `<button data-go="${l[0]}" class="${S.screen === l[0] ? "on" : ""}">${l[1]}</button>` : "<i></i>")).join("");
  document.querySelectorAll("[data-go]").forEach((el) => el.onclick = () => { S.screen = el.dataset.go; render(); });
  document.querySelectorAll("[data-theme-set]").forEach((el) => el.onclick = () => { S.theme = el.dataset.themeSet; render(); });
}
const q = new URLSearchParams(location.hash.slice(1)); for (const [k, v] of q) S[k] = v;
render();
</script>
</body>
</html>
