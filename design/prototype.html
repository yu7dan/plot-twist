<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Plot Twist — 可交互原型</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="ds.css" />
<link rel="stylesheet" href="ds-v3.css" />
<link rel="stylesheet" href="ds-v4.css" />
<style>
  html, body { height: 100%; background: #050506; overflow: hidden; }
  body { display: flex; flex-direction: column; font-family: "Geist", "PingFang SC", "Microsoft YaHei", sans-serif; }

  .top { height: 56px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; border-bottom: 1px solid var(--line); gap: 14px; }
  .top .t { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); white-space: nowrap; }
  .top .t b { color: var(--text); font-weight: 600; }
  .top .t img { width: 22px; height: 22px; border-radius: 6px; }
  .seg2 { display: flex; background: var(--s1); border: 1px solid var(--line); border-radius: 12px; padding: 3px; }
  .seg2 button { height: 32px; padding: 0 14px; border-radius: 9px; font-size: 13px; color: var(--muted); font-weight: 500; display: inline-flex; align-items: center; gap: 8px; }
  .seg2 button.on { background: var(--s3); color: var(--text); }
  .seg2 button .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); display: none; }
  .seg2 button.ping .dot { display: inline-block; animation: blink 1s steps(1) infinite; }
  .mid { display: flex; gap: 10px; align-items: center; }
  .ctrl { display: flex; gap: 6px; }
  .ctrl button { height: 34px; padding: 0 12px; border-radius: 10px; background: var(--s1); border: 1px solid var(--line); font-size: 13px; color: var(--soft); }
  .ctrl button.on { border-color: rgba(200, 245, 66, 0.4); color: var(--accent); }

  .viewport { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; position: relative; }
  .holder { position: relative; overflow: hidden; border-radius: 14px; box-shadow: 0 0 0 1px var(--line), 0 40px 120px -40px rgba(0, 0, 0, 0.9); }
  #canvas { position: absolute; left: 0; top: 0; width: 1440px; height: 900px; transform-origin: 0 0; background: #050506; }
  #scene { position: absolute; inset: 0; }
  .phone-scene { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: radial-gradient(700px 400px at 50% 30%, rgba(200, 245, 66, 0.05), transparent 70%), #050506; }
  .ps-label { font-size: 13px; color: var(--dim); letter-spacing: 0.08em; text-transform: uppercase; }
  .phone .chat-body { padding-bottom: 8px; }
  .empty-note { position: absolute; left: 24px; right: 24px; top: 44%; text-align: center; color: var(--dim); font-size: 14px; line-height: 1.6; }
  .empty-note img { width: 96px; margin: 0 auto 12px; display: block; mix-blend-mode: lighten; }
  .desk-empty { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--dim); font-size: 15px; line-height: 1.7; text-align: center; }
  .desk-empty img { width: 140px; margin-bottom: 14px; mix-blend-mode: lighten; }
  .win-label { text-align: center; font-size: 12px; color: var(--dim); letter-spacing: 0.08em; text-transform: uppercase; padding-top: 34px; }
  .win-label + .chat-window { margin-top: 12px; }

  #ring { position: fixed; z-index: 500; pointer-events: none; border-radius: 16px; border: 2px solid var(--accent); box-shadow: 0 0 0 4px rgba(200, 245, 66, 0.15); transition: all .25s ease; opacity: 0; }
  #ring.show { opacity: 1; animation: ringPulse 1.6s ease-in-out infinite; }
  @keyframes ringPulse { 50% { box-shadow: 0 0 0 9px rgba(200, 245, 66, 0.06); } }
  #tip { position: fixed; z-index: 501; pointer-events: none; padding: 9px 12px; border-radius: 12px; background: var(--accent); color: var(--accent-ink); font-size: 13px; font-weight: 600; line-height: 1.4; box-shadow: 0 12px 30px -10px rgba(0, 0, 0, 0.7); transition: opacity .2s; opacity: 0; white-space: nowrap; }
  #tip.show { opacity: 1; }
  #tip::after { content: ""; position: absolute; left: 50%; width: 10px; height: 10px; background: var(--accent); transform: translateX(-50%) rotate(45deg); }
  #tip.below::after { top: -4px; }
  #tip.above::after { bottom: -4px; }

  .capbar { flex-shrink: 0; padding: 12px 28px 14px; border-top: 1px solid var(--line); background: #08080A; }
  .cap-row { display: flex; align-items: center; gap: 22px; max-width: 1240px; margin: 0 auto; }
  .cap-n { font-size: 32px; font-weight: 600; letter-spacing: -0.04em; color: var(--accent); font-variant-numeric: tabular-nums; min-width: 60px; }
  .cap-n small { font-size: 14px; color: var(--dim); font-weight: 500; letter-spacing: 0; margin-left: 4px; }
  .cap-txt { flex: 1; min-width: 0; }
  .cap-txt b { font-size: 17px; font-weight: 600; display: block; }
  .cap-txt p { font-size: 14px; color: var(--soft); margin-top: 3px; line-height: 1.5; }
  .cap-tags { display: flex; gap: 6px; flex-shrink: 0; }
  .ctag { height: 30px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line2); display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--soft); background: var(--s1); }
  .ctag .brand, .ctag .ci { width: 16px; height: 16px; }
  .ctag .brand.os { width: 52px; height: 13px; }
  .bar2 { display: flex; gap: 4px; max-width: 1240px; margin: 10px auto 0; }
  .bar2 button { flex: 1; height: 18px; position: relative; }
  .bar2 button::before { content: ""; position: absolute; left: 0; right: 0; top: 7px; height: 4px; border-radius: 4px; background: var(--s3); }
  .bar2 button.done::before { background: var(--accent); opacity: 0.5; }
  .bar2 button.cur::before { background: var(--accent); }
  .bar2 button:hover::before { background: var(--soft); }
  .bar2 button span { position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%); font-size: 12px; color: var(--text); background: var(--s3); padding: 4px 8px; border-radius: 8px; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .15s; }
  .bar2 button:hover span { opacity: 1; }
  .flash { position: fixed; z-index: 600; left: 50%; top: 72px; transform: translateX(-50%); padding: 8px 14px; border-radius: 10px; background: var(--s3); border: 1px solid var(--line2); font-size: 13px; color: var(--soft); animation: fade .2s both; }
</style>
</head>
<body>
  <div class="top">
    <span class="t"><img src="assets/app-icon.png" alt="" /><b>Plot Twist</b>· 可交互原型</span>
    <div class="mid">
      <div class="seg2" id="roleSeg">
        <button data-role="sender" id="role-sender"><span class="dot"></span>发送方 · Kai</button>
        <button data-role="recipient" id="role-recipient"><span class="dot"></span>收礼方 · Maya</button>
      </div>
      <div class="seg2" id="devSeg">
        <button data-dev="desk" id="dev-desk">电脑</button>
        <button data-dev="phone" id="dev-phone">手机</button>
      </div>
    </div>
    <div class="ctrl">
      <button id="hintBtn" class="on">导览提示：开</button>
      <button id="reset">↺ 重新开始</button>
      <a href="index.html"><button>设计板</button></a>
    </div>
  </div>
  <div class="viewport" id="vp"><div class="holder" id="holder"><div id="canvas"><div id="scene"></div></div></div></div>
  <div class="capbar">
    <div class="cap-row">
      <div class="cap-n" id="capN">01</div>
      <div class="cap-txt"><b id="capT"></b><p id="capD"></p></div>
      <div class="cap-tags" id="capTags"></div>
    </div>
    <div class="bar2" id="bar2"></div>
  </div>
  <div id="ring"></div>
  <div id="tip"></div>

<script src="brand.js"></script>
<script src="tokens.js"></script>
<script src="ui.js"></script>
<script>
  const U = UI;
  const C = window.CHAINS;
  const params = new URLSearchParams(location.search);
  const scene = document.getElementById("scene");
  const canvas = document.getElementById("canvas");
  let scale = 1;
  function fit() {
    const vp = document.getElementById("vp");
    scale = Math.min(1, (vp.clientWidth - 40) / 1440, (vp.clientHeight - 24) / 900);
    canvas.style.zoom = scale;
    const h = document.getElementById("holder");
    h.style.width = 1440 * scale + "px";
    h.style.height = 900 * scale + "px";
  }
  window.addEventListener("resize", fit);
  fit();

  /* ---------- fake SERV: one sentence → gift ---------- */
  const REL = { sister: "Sis", brother: "Bro", mom: "Mom", mother: "Mom", dad: "Dad", father: "Dad", wife: "Love", husband: "Love", girlfriend: "Love", boyfriend: "Love", friend: "Friend", boss: "Boss",
    妹妹: "Sis", 姐姐: "Sis", 哥哥: "Bro", 弟弟: "Bro", 妈妈: "Mom", 爸爸: "Dad", 老婆: "Love", 老公: "Love", 女朋友: "Love", 男朋友: "Love", 朋友: "Friend", 老板: "Boss", 同事: "Friend" };
  const OCC = [
    [/birthday|bday|生日/i, "Birthday"], [/anniversary|纪念日/i, "Anniversary"], [/wedding|婚礼|结婚/i, "Wedding"],
    [/graduat|毕业/i, "Graduation"], [/new job|offer|promotion|入职|新工作|升职/i, "New job"], [/thank|感谢|谢谢/i, "Thank you"],
    [/christmas|圣诞/i, "Christmas"], [/lunar|chinese new year|春节|红包/i, "Lunar New Year"], [/new year|新年/i, "New Year"], [/baby|宝宝|满月/i, "New baby"],
  ];
  const CHAIN_RE = [[/solana|\bsol\b|索拉纳/i, "solana"], [/polygon|matic|马蹄/i, "polygon"], [/avalanche|avax|雪崩/i, "avalanche"], [/\barc\b/i, "arc"], [/tempo/i, "tempo"], [/robinhood|罗宾汉|usdg/i, "robinhood"], [/\bbase\b/i, "base"]];
  const CORES = ["A little something for the new chapter", "No reason needed — just a plot twist", "Something small to make today brighter"];
  const CLOSE = { Birthday: (n) => `Happy birthday, ${n}.`, Anniversary: (n) => `Happy anniversary, ${n}.`, Wedding: (n) => `Congrats, ${n}.`, Graduation: (n) => `Congrats, ${n}.`,
    "New job": (n) => `Go get it, ${n}.`, "Thank you": (n) => `Thank you, ${n}.`, Christmas: (n) => `Merry Christmas, ${n}.`, "Lunar New Year": (n) => `Happy Lunar New Year, ${n}.`, "New Year": (n) => `Happy New Year, ${n}.`, "New baby": () => `Welcome to the world, little one.` };
  function noteFor({ name, occasion, text }, variant = 0) {
    const core = CORES[variant % CORES.length];
    const ctx = /moved|move|new city|berlin|搬/i.test(text || "") ? " — new city, same you." : occasion === "New job" ? " — for the next chapter." : ".";
    const close = (CLOSE[occasion] || ((n) => `For you, ${n}.`))(name);
    return `${core}${ctx} ${close}`;
  }
  function parsePrompt(t, variant = 0) {
    const text = t.trim();
    let amount = 50;
    const m = text.match(/\$\s?(\d+(?:\.\d+)?)/) || text.match(/(\d+(?:\.\d+)?)\s?(?:usd|usdc|usdg|dollars|bucks|美元|美金|刀|块|u\b)/i);
    if (m) amount = Math.min(120, Math.max(5, Math.round(+m[1])));
    let name = null;
    const en = text.match(/\b(?:for|to)\s+(?:my\s+)?(?:(sister|brother|mom|mother|dad|father|wife|husband|girlfriend|boyfriend|friend|boss)\s+)?([A-Z][a-zA-Z]+)?/i);
    if (en && en[2] && !/^(my|a|an|the|her|his|birthday|gift|base|solana|polygon|avalanche|arc|tempo|robinhood)$/i.test(en[2])) name = en[2][0].toUpperCase() + en[2].slice(1);
    else if (en && en[1]) name = REL[en[1].toLowerCase()];
    if (!name) {
      const zh = text.match(/给(?:我的?)?(妹妹|姐姐|哥哥|弟弟|妈妈|爸爸|老婆|老公|女朋友|男朋友|朋友|老板|同事)?([一-龥]{1,3}|[A-Za-z]+)?/);
      if (zh && zh[2] && !/^(送|买|一|个|的)/.test(zh[2])) name = zh[2];
      else if (zh && zh[1]) name = REL[zh[1]];
    }
    name = name || "Maya";
    const occasion = (OCC.find(([re]) => re.test(text)) || [, "Just because"])[1];
    const hit = CHAIN_RE.find(([re]) => re.test(text));
    const chain = hit ? hit[1] : "base";
    const insight = hit ? `You mentioned ${C[chain].name} — ${name} will claim there.` : "";
    return { amount, amountStr: String(amount), name, occasion, chain, insight, note: noteFor({ name, occasion, text }, variant) };
  }

  /* ---------- state ---------- */
  const S0 = () => ({
    role: "sender", dev: { sender: "desk", recipient: "phone" },
    screen: "landing", phase: "empty", promptText: "", g: U.gift(), variant: 0,
    chainTouched: false, editingNote: false, animate: false,
    menu: null, kiteOn: false, kc: "email",
    modal: null, pkOpen: false, pk: "idle", seal: ["run", "wait", "wait", "wait"], copied: false, paid: false,
    phoneScreen: "chat", chatN: 3, claim: "sealed", display: null, burst: false, ask: false, askedAny: false, sheet: null,
    claimed: false, toast: false, toastShown: false, pingSender: false, pingRecipient: false,
  });
  let S = S0();
  let epoch = 0;
  const wait = (ms) => { const e = epoch; return new Promise((res, rej) => setTimeout(() => (e === epoch ? res() : rej(new Error("stale"))), ms)); };
  const guard = (p) => p.catch((e) => { if (e.message !== "stale") console.error(e); });
  const $ = (id) => scene.querySelector(`[data-id="${id}"]`);
  const dev = () => S.dev[S.role];
  const isM = () => dev() === "phone";
  function flash(msg) { const f = document.createElement("div"); f.className = "flash"; f.textContent = msg; document.body.appendChild(f); setTimeout(() => f.remove(), 1600); }

  /* ---------- render ---------- */
  const addr = () => (S.g.chain === "solana" ? "7xKX…q9Fd" : "0x12f…a34");
  const walletPill = () => `<span class="pill"><span class="avatar b"></span>${isM() ? "" : addr()}</span>`;
  function senderContent(m) {
    if (S.screen === "landing") return m ? `<div class="ph-body" style="height:calc(100% - 52px)">${U.landing({ m: true })}</div>` : U.landing();
    if (S.screen === "gifts") return U.giftsPage({ m, maya: S.claimed ? "done" : S.paid ? "wait" : "unpaid", toast: S.toast, g: S.g });
    return U.createScreen({ m, g: S.g, phase: S.phase === "empty" && S.promptText ? "typing" : S.phase, editable: true, promptText: S.promptText, ready: S.promptText.trim().length >= 8, focus: document.activeElement?.dataset?.id === "prompt-input", animate: S.animate, editingNote: S.editingNote });
  }
  function senderOverlays() {
    let o = "";
    if (S.menu === "net") o += `<div class="menu-scrim" data-id="menu-close"></div>${U.networkMenu(S.g.chain, Number(S.g.amount))}`;
    let inner = "";
    if (S.modal === "connect") inner = U.kiteConnect(S.kc);
    else if (S.modal === "review") inner = U.reviewModal(S.g);
    else if (S.modal === "kite") inner = U.kiteSheet(S.g) + (S.pkOpen ? U.passkey(S.pk) : "");
    else if (S.modal === "sealing") inner = U.sealing(S.seal, S.g);
    else if (S.modal === "ready") inner = U.readyModal(S.g, { copied: S.copied });
    if (inner) o += `<div class="scrim" data-id="scrim">${inner}</div>`;
    return o;
  }
  function recipientContent(m) {
    const pub = (right) => (m ? U.phNav(right) : `<header class="nav">${U.logo()}<div class="nav-r">${right}</div></header>`);
    if (!S.paid) {
      return m ? U.chat(0, S.g) + `<div class="empty-note"><img src="assets/m-wink.png" alt="" />Kai 还没有发出礼物。<br />先切到“发送方 · Kai”创建一份。</div>`
               : `<div class="desk-empty"><img src="assets/m-wink.png" alt="" />Kai 还没有发出礼物。<br />先切到“发送方 · Kai”创建一份。</div>`;
    }
    if (S.phoneScreen === "chat") return m ? U.chat(S.chatN, S.g) : `<div class="desk-scroll"><div class="win-label">Telegram · Kai</div><div class="chat-window">${U.chat(S.chatN, S.g)}</div></div>`;
    const right = ["connected", "claiming", "claimed"].includes(S.claim) ? walletPill() : '<a class="btn sm sec" data-id="send-own">Send your own</a>';
    const card = U.claimCard({ g: S.g, phase: S.claim, display: S.display, ask: S.ask, burst: S.burst });
    return m ? `${pub(right)}<div class="ph-body"><div class="claim-wrap"><div class="col">${card}</div></div></div>`
             : `<div class="desk-scroll">${pub(right)}<div class="claim-wrap" style="padding-bottom:60px"><div class="col">${card}</div></div></div>`;
  }
  function render() {
    U.setKite(S.kiteOn);
    const ae = document.activeElement;
    const keep = ae && scene.contains(ae) && ae.dataset.id ? { id: ae.dataset.id, s: ae.selectionStart, e: ae.selectionEnd } : null;
    const scrollers = [...scene.querySelectorAll(".ph-body, .desk-scroll, .tlist")].map((el) => el.scrollTop);

    const m = isM();
    let content, overlays = "";
    if (S.role === "sender") { content = senderContent(m); overlays = senderOverlays(); }
    else { content = recipientContent(m); if (S.sheet) overlays = `<div>${U.walletSheet(S.g.chain, S.sheet === "open" ? "" : S.sheet)}</div>`; }

    if (m) {
      scene.innerHTML = `<div class="phone-scene"><span class="ps-label">${S.role === "sender" ? "Kai’s phone" : "Maya’s phone"}</span>${U.phone(content + overlays)}</div>`;
    } else {
      const wrapped = /desk-scroll|desk-empty/.test(content.slice(0, 200)) ? content : `<div class="desk-scroll">${content}</div>`;
      scene.innerHTML = `<div class="screen desk glow">${wrapped}${overlays}</div>`;
    }
    S.animate = false;
    U.hydrate(scene);
    [...scene.querySelectorAll(".ph-body, .desk-scroll, .tlist")].forEach((el, i) => { if (scrollers[i] != null) el.scrollTop = scrollers[i]; });
    if (keep) {
      const el = $(keep.id);
      if (el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA")) { el.focus({ preventScroll: true }); try { el.setSelectionRange(keep.s, keep.e); } catch {} }
    }
    syncTop();
    caption();
    setupReveal();
  }
  let revealed = new Set();
  function setupReveal() {
    const land = scene.querySelector(".land");
    if (!land) return;
    const root = land.closest(".desk-scroll, .ph-body");
    const secs = [...land.querySelectorAll(".rv")];
    secs.forEach((el, i) => { if (revealed.has(i)) el.classList.add("in"); });
    land.classList.add("anim");
    const io = new IntersectionObserver((ents) => ents.forEach((e) => {
      if (!e.isIntersecting) return;
      e.target.classList.add("in"); revealed.add(secs.indexOf(e.target)); io.unobserve(e.target);
    }), { root, threshold: 0.12 });
    secs.forEach((el) => { if (!el.classList.contains("in")) io.observe(el); });
  }
  function syncTop() {
    document.querySelectorAll("#roleSeg button").forEach((b) => b.classList.toggle("on", b.dataset.role === S.role));
    document.querySelectorAll("#devSeg button").forEach((b) => b.classList.toggle("on", b.dataset.dev === dev()));
    document.getElementById("role-sender").classList.toggle("ping", S.pingSender && S.role !== "sender");
    document.getElementById("role-recipient").classList.toggle("ping", S.pingRecipient && S.role !== "recipient");
  }

  /* ---------- network ---------- */
  function setChain(id) {
    if (S.g.chain !== id) { S.g.chain = id; S.g.insight = ""; }
    S.chainTouched = true; S.menu = null;
  }

  /* ---------- flows ---------- */
  function openConnect() { S.menu = null; S.editingNote = false; S.modal = "connect"; S.kc = "email"; render(); }
  async function kcSend() { S.kc = "sending"; render(); await wait(800); S.kc = "code"; render(); }
  async function kcVerify() {
    S.kc = "linking"; render();
    await wait(1100);
    S.kiteOn = true; S.modal = null; S.kc = "email"; render();
    flash("Kite Passport 已连接");
  }
  async function design() {
    S.phase = "generating"; S.modal = null; render();
    await wait(1700);
    const parsed = parsePrompt(S.promptText, S.variant);
    S.g = U.gift({ ...parsed, prompt: S.promptText.trim(), code: Math.random().toString(16).slice(2, 10) });
    S.phase = "filled"; S.animate = true; S.chainTouched = false; render();
  }
  function patchSeal() {
    const t = document.createElement("div"); t.innerHTML = U.sealing(S.seal, S.g);
    scene.querySelector(".steps")?.replaceWith(t.querySelector(".steps"));
  }
  async function runSealing() {
    S.modal = "sealing"; S.seal = ["run", "wait", "wait", "wait"]; render();
    await wait(900); S.seal = ["ok", "run", "wait", "wait"]; patchSeal();
    await wait(1000); S.seal = ["ok", "ok", "run", "wait"]; patchSeal();
    await wait(1200); S.seal = ["ok", "ok", "ok", "run"]; patchSeal();
    await wait(800); S.seal = ["ok", "ok", "ok", "ok"]; patchSeal();
    await wait(700);
    markPaid(); S.modal = "ready"; render();
  }
  function markPaid() {
    if (!S.paid) U.spend(S.g.chain, U.need(S.g.amount));
    S.paid = true; S.pingRecipient = true;
  }
  async function approvePasskey() {
    S.pk = "scan"; render();
    await wait(1300);
    S.pk = "ok"; render();
    await wait(800);
    S.pkOpen = false; S.pk = "idle";
    await runSealing();
  }
  async function deliverChat() {
    S.role = "recipient"; S.phoneScreen = "chat"; S.pingRecipient = false;
    S.chatN = 0; render();
    await wait(450); S.chatN = 1; render();
    await wait(650); S.chatN = 2; render();
    await wait(650); S.chatN = 3; render();
  }
  async function reveal() {
    S.claim = "revealed"; S.display = "0.00"; S.burst = true; render();
    const el = $("amount"), to = Number(S.g.amount), t0 = performance.now();
    while (true) {
      await wait(16);
      const k = Math.min(1, (performance.now() - t0) / 1100), e = 1 - Math.pow(1 - k, 3);
      if (el) el.textContent = "$" + (to * e).toFixed(2);
      if (k >= 1) break;
    }
    S.display = null; render();
    await wait(600); S.burst = false;
  }
  async function connect(w) { S.sheet = w; render(); await wait(1100); S.sheet = null; S.claim = "connected"; render(); }
  async function claim() {
    S.claim = "claiming"; render();
    await wait(1800);
    S.claim = "claimed"; S.claimed = true; S.pingSender = true; render();
  }
  function scrollPhoneBottom() { const b = scene.querySelector(".ph-body") || scene.querySelector(".desk-scroll"); if (b) b.scrollTo({ top: b.scrollHeight, behavior: "smooth" }); }
  function resetCreate() { const d = S.dev; epoch++; S = Object.assign(S0(), { screen: "create", dev: d }); }
  function setRole(r) {
    S.role = r; S.menu = null;
    if (r === "sender") {
      S.pingSender = false;
      if (S.claimed && !S.toastShown) {
        Object.assign(S, { screen: "gifts", modal: null, toast: true, toastShown: true });
        guard(wait(4500).then(() => { S.toast = false; if (S.role === "sender") render(); }));
      }
    } else S.pingRecipient = false;
    render();
  }
  function setDev(d) { S.dev[S.role] = d; S.menu = null; render(); }

  /* ---------- events ---------- */
  scene.addEventListener("click", (ev) => {
    const el = ev.target.closest("[data-id]");
    if (!el) return;
    const id = el.dataset.id;
    if (el.tagName === "A") ev.preventDefault();
    if (id === "scrim" && ev.target !== el) return;
    if (el.disabled) return;

    if (id.startsWith("net-")) { setChain(id.slice(4)); render(); return; }
    if (id.startsWith("w-")) { if (S.sheet === "open") guard(connect(id.slice(2))); return; }
    if (id.startsWith("tx-")) { flash(`会在 ${C[S.g.chain].explorer} 打开这笔交易`); return; }

    switch (id) {
      case "logo": case "logo-f": if (S.role === "sender") { S.screen = "landing"; S.modal = null; S.menu = null; render(); } break;
      case "hero-cta": case "hero-cta2": case "launch": case "tab-create":
        S.screen = "create"; S.modal = null; S.menu = null; render(); break;
      case "how": scrollToEl($("how-sec"), "start"); break;
      case "example-cta": S.screen = "create"; S.modal = null; S.phase = "empty"; S.promptText = U.PROMPT; render(); break;
      case "tab-gifts": case "to-gifts": S.screen = "gifts"; S.modal = null; S.menu = null; render(); break;
      case "new-gift": case "send-back": case "send-own": resetCreate(); render(); break;
      case "example": S.promptText = U.PROMPT; render(); setTimeout(() => $("prompt-input")?.focus({ preventScroll: true }), 0); break;
      case "prompt": if (S.phase !== "filled" && S.phase !== "generating") $("prompt-input")?.focus({ preventScroll: true }); break;
      case "chain-btn": case "chain-btn2": if (S.role === "sender" && S.screen !== "landing") { S.menu = S.menu ? null : "net"; render(); } break;
      case "menu-close": S.menu = null; render(); break;
      case "cta":
        if (S.phase === "empty" && S.promptText.trim().length >= 8) guard(design());
        else if (S.phase === "filled") {
          if (!S.kiteOn) { openConnect(); break; }
          S.editingNote = false;
          if (!U.canPay(S.g.chain, S.g.amount)) S.menu = "net"; else S.modal = "review";
          render();
        }
        break;
      case "regen": S.variant++; S.g.note = noteFor({ name: S.g.name, occasion: S.g.occasion, text: S.g.prompt }, S.variant); S.animate = true; render(); break;
      case "max": if (S.phase === "filled") { const mx = U.maxGift(S.g.chain); S.g.amount = mx; S.g.amountStr = String(mx); render(); } break;
      case "note-edit": S.editingNote = true; render(); setTimeout(() => { const i = $("note-input"); if (i) { i.focus({ preventScroll: true }); i.setSelectionRange(i.value.length, i.value.length); } }, 0); break;
      case "note-save": S.editingNote = false; render(); break;
      case "close": case "scrim":
        if (S.modal === "sealing") break;
        epoch++; S.modal = null; S.kc = "email"; S.pkOpen = false; S.pk = "idle"; render(); break;
      case "approve": S.modal = "kite"; render(); break;
      case "kite-connect": if (S.role === "sender" && !S.kiteOn) openConnect(); break;
      case "kc-send": guard(kcSend()); break;
      case "kc-verify": guard(kcVerify()); break;
      case "kite-approve": S.pkOpen = true; S.pk = "idle"; render(); break;
      case "pk-cancel": S.pkOpen = false; render(); break;
      case "pk-go": guard(approvePasskey()); break;
      case "copy":
        navigator.clipboard?.writeText(`https://plottwist.gift/g/${S.g.code}`).catch(() => {});
        S.copied = true; render();
        guard(wait(1600).then(() => { S.copied = false; if (S.modal === "ready") render(); }));
        break;
      case "share-tg": case "share-x": case "share-wa": guard(deliverChat()); break;
      case "row-copy": flash("链接已复制"); break;
      case "waitlist": flash("已加入 Stocks 候补名单（演示）"); break;
      case "link-card": S.phoneScreen = "claim"; S.claim = "sealed"; S.ask = false; render(); break;
      case "reveal": case "seal": if (S.claim === "sealed") guard(reveal()); break;
      case "ask": S.ask = S.ask ? false : {}; render(); if (S.ask) setTimeout(scrollPhoneBottom, 30); break;
      case "ask-why": case "ask-what": S.ask = Object.assign({}, S.ask || {}, { [id.slice(4)]: true }); S.askedAny = true; render(); setTimeout(scrollPhoneBottom, 30); break;
      case "connect": S.sheet = "open"; render(); break;
      case "sheet-close": if (S.sheet === "open") { S.sheet = null; render(); } break;
      case "claim": guard(claim()); break;
    }
  });

  let promptKey = "";
  function promptRefresh() {
    const k = (S.promptText ? 1 : 0) + "|" + (S.promptText.trim().length >= 8 ? 1 : 0);
    if (k !== promptKey) { promptKey = k; render(); } else caption();
  }
  scene.addEventListener("input", (ev) => {
    const id = ev.target.dataset.id;
    if (id === "prompt-input") { S.promptText = ev.target.value; if (!ev.isComposing) promptRefresh(); }
    if (id === "amount-input") { const raw = ev.target.value.replace(/[^0-9.]/g, ""); S.g.amountStr = raw; S.g.amount = parseFloat(raw) || 0; render(); }
    if (id === "note-input") S.g.note = ev.target.value;
  });
  scene.addEventListener("compositionend", (ev) => {
    const id = ev.target.dataset.id;
    if (id === "prompt-input") { S.promptText = ev.target.value; promptRefresh(); }
  });
  scene.addEventListener("keydown", (ev) => {
    const id = ev.target.dataset?.id;
    if (id === "prompt-input" && ev.key === "Enter" && !ev.shiftKey && !ev.isComposing) { ev.preventDefault(); if (S.promptText.trim().length >= 8) guard(design()); }
    if (id === "note-input" && ev.key === "Enter") { S.editingNote = false; render(); }
    if (id === "amount-input" && ev.key === "Enter") ev.target.blur();
  });
  document.addEventListener("keydown", (ev) => {
    if (ev.key !== "Escape") return;
    if (S.menu) S.menu = null;
    else if (S.modal && S.modal !== "sealing") { S.modal = null; S.pkOpen = false; }
    else if (S.sheet === "open") S.sheet = null;
    else return;
    render();
  });
  document.querySelectorAll("#roleSeg button").forEach((b) => b.addEventListener("click", () => setRole(b.dataset.role)));
  document.querySelectorAll("#devSeg button").forEach((b) => b.addEventListener("click", () => setDev(b.dataset.dev)));
  document.getElementById("reset").onclick = () => { const d = S.dev; epoch++; S = Object.assign(S0(), { dev: d }); U.resetBalances(); revealed = new Set(); render(); };
  let hints = params.get("hints") !== "0";
  const hintBtn = document.getElementById("hintBtn");
  const setHintLabel = () => { hintBtn.textContent = hints ? "导览提示：开" : "导览提示：关"; hintBtn.classList.toggle("on", hints); };
  hintBtn.onclick = () => { hints = !hints; setHintLabel(); };
  setHintLabel();

  /* ---------- chapters & hints ---------- */
  const TAG = {
    SERV: `<span class="ctag">${U.brand("openserv", "os")}SERV Reasoning</span>`,
    Kite: `<span class="ctag">${U.brand("kite")}Kite Passport</span>`,
    Chains: `<span class="ctag">${U.CHAIN_ORDER.map((c) => U.chainImg(c)).join("")}7 networks</span>`,
    Wallet: `<span class="ctag"><img src="${window.WALLETS.metamask.icon}" style="width:16px;height:16px" alt="" />Wallets</span>`,
  };
  const CH = [
    ["首页", "平台级叙事：AI 惊喜礼物平台，数字美元（USDC / USDG）先上线、股票即将上线。往下滑看完整故事，点 Create a gift 开始。", []],
    ["一句话描述礼物", "自己输入（中英文都行），或用示例：送给谁、什么场合、大概多少钱，也可以说想用哪条网络。", ["SERV"]],
    ["SERV 设计这份礼物", "SERV 读懂这句话：识别收礼人、场合、金额和网络，写好祝福语。", ["SERV"]],
    ["选择礼物网络", "Kite Passport 原生支持的 7 条网络任选：6 条用 USDC，Robinhood Chain 用 USDG。你在哪条网络付款，Maya 就在哪条网络领取；换网络不改变礼物内容。", ["Chains"]],
    ["微调金额与祝福语", "金额可以直接改，祝福语可以编辑，或让 AI 重写一句。", []],
    ["连接 Kite Passport", "用邮箱验证码连接 Kite Passport，看到每条网络上的余额；余额不够的网络不能选，会提示换一条。Plot Twist 拿不到你的私钥。", ["Kite"]],
    ["确认", "一次讲清：付多少、从哪条网络的 Kite 钱包付、Maya 收到多少，用 Kite 钱包转账支付。", []],
    ["Kite Passport 批准转账", "Kite 的转账批准页：金额、网络、收款方一目了然，用 passkey 批准这一笔，只转这个金额到这个地址。", ["Kite"]],
    ["封装礼物", "批准后：稳定币从你的 Kite 钱包转给 Plot Twist，平台核对链上到账，为 Maya 预留同等金额，封装成专属链接。", ["Kite", "Chains"]],
    ["分享链接", "复制链接、扫码，或一键发到 Telegram / X / WhatsApp。", []],
    ["朋友收到礼物", "Maya 在聊天里看到一张礼物卡片：内容是封存的，只知道是 Kai 送的。", []],
    ["揭晓惊喜", "打开时是封存的，点击揭晓，吉祥物撒花、金额滚动出现：这就是那个 plot twist。", []],
    ["问问这份礼物", "不了解 USDC？直接问。SERV 根据这份礼物的上下文回答，不给投资建议。", ["SERV"]],
    ["连接钱包", "按礼物所在网络推荐钱包：EVM 网络用 MetaMask 等，Solana 用 Phantom 等；较新的网络，钱包会提示添加一次。", ["Wallet"]],
    ["领取到账", "稳定币直接转入 Maya 的钱包，gas 由平台代付，交易可在对应网络的浏览器上查到。", ["Chains"]],
    ["闭环", "Kai 这边收到通知：礼物已被领取。可以再送一份，或者让 Maya 回赠。", []],
  ];
  function chapterOf() {
    if (S.role === "sender") {
      if (S.screen === "landing") return 0;
      if (S.screen === "gifts") return S.claimed ? 15 : S.paid ? 9 : 1;
      if (S.modal === "connect") return 5;
      if (S.modal === "review") return 6;
      if (S.modal === "kite") return 7;
      if (S.modal === "sealing") return 8;
      if (S.modal === "ready") return 9;
      if (S.phase === "filled") return S.kiteOn ? 5 : S.chainTouched ? 4 : 3;
      if (S.phase === "generating" || S.promptText.trim().length >= 8) return 2;
      return 1;
    }
    if (!S.paid || S.phoneScreen === "chat") return 10;
    if (S.claim === "sealed") return 11;
    if (S.claim === "revealed") return S.sheet ? 13 : S.askedAny ? 13 : 12;
    return 14;
  }
  function hintOf() {
    const c = chapterOf();
    if (S.role === "sender") {
      if (S.screen === "gifts" && !S.paid) return ["tab-create", "回到 Create 创建礼物"];
      if (c === 0) return ["hero-cta", "点这里开始创建礼物"];
      if (c === 1) return $("example") ? ["example", "自己输入，或者先用一个示例"] : ["prompt-input", "描述你想送的礼物"];
      if (c === 2) return S.phase === "generating" ? null : ["cta", "交给 SERV 设计这份礼物"];
      if (c === 3 || c === 4) {
        if (S.menu === "net") return [S.g.chain === "solana" ? "net-base" : "net-solana", "选一条网络"];
        if (S.editingNote) return ["note-save", "改好了点这里保存"];
        if (!S.chainTouched) return ["chain-btn2", "可以换一条网络，礼物内容不变"];
        return ["cta", "连接 Kite Passport 来付款"];
      }
      if (c === 5) {
        if (S.modal === "connect") return S.kc === "email" ? ["kc-send", "用邮箱验证码连接 Kite"] : S.kc === "code" ? ["kc-verify", "验证并连接"] : null;
        if (S.menu === "net") { const ok = U.CHAIN_ORDER.find((id) => id !== S.g.chain && U.canPay(id, S.g.amount)); return ok ? [`net-${ok}`, "选一条余额够的网络"] : null; }
        if (S.editingNote) return ["note-save", "改好了点这里保存"];
        if (!U.canPay(S.g.chain, S.g.amount)) return ["cta", "这条网络余额不够，换一条"];
        return ["cta", "确认没问题，创建礼物"];
      }
      if (c === 6) return ["approve", "用 passkey 批准转账"];
      if (c === 7) return !S.pkOpen ? ["kite-approve", "这是 Kite Passport 的转账批准页"] : S.pk === "idle" ? ["pk-go", "确认 passkey"] : null;
      if (c === 9) return S.screen === "gifts" ? ["#role-recipient", "切到 Maya 那边看看"] : ["share-tg", "发给 Maya，然后会切到她那边"];
      if (c === 15) return S.toast ? null : ["new-gift", "再送一份"];
      return null;
    }
    if (!S.paid) return ["#role-sender", "先让 Kai 创建并发送礼物"];
    if (c === 10) return S.chatN >= 3 ? ["link-card", "点开礼物卡片"] : null;
    if (c === 11) return ["reveal", "揭晓惊喜"];
    if (c === 12) return S.ask ? ["ask-why", "问问为什么这样配"] : ["ask", "问问这份礼物（可选）"];
    if (c === 13) return S.sheet === "open" ? [`w-${C[S.g.chain].wallets[0]}`, "选一个钱包"] : S.sheet ? null : ["connect", "连接钱包领取"];
    if (c === 14) return S.claim === "connected" ? ["claim", "领取到钱包"] : S.claim === "claimed" ? ["#role-sender", "切回 Kai，看看他那边"] : null;
    return null;
  }

  const bar2 = document.getElementById("bar2");
  bar2.innerHTML = CH.map((c, i) => `<button data-i="${i}"><span>${String(i + 1).padStart(2, "0")} · ${c[0]}</span></button>`).join("");
  bar2.querySelectorAll("button").forEach((b) => b.addEventListener("click", () => jump(+b.dataset.i)));
  let lastCh = -1;
  function caption() {
    const i = chapterOf();
    if (i === lastCh) return;
    lastCh = i;
    const [t, d, tags] = CH[i];
    document.getElementById("capN").innerHTML = String(i + 1).padStart(2, "0") + `<small>/ ${CH.length}</small>`;
    document.getElementById("capT").textContent = t;
    document.getElementById("capD").textContent = d;
    document.getElementById("capTags").innerHTML = tags.map((k) => TAG[k]).join("");
    bar2.querySelectorAll("button").forEach((b, k) => { b.className = k < i ? "done" : k === i ? "cur" : ""; });
  }

  function jump(i) {
    epoch++;
    const d = S.dev;
    const example = parsePrompt(U.PROMPT);
    const filled = { screen: "create", phase: "filled", promptText: U.PROMPT, g: U.gift({ ...example, prompt: U.PROMPT }) };
    const touched = { ...filled, chainTouched: true };
    const conn = { ...touched, kiteOn: true };
    const paid = { ...conn, paid: true, modal: null };
    const R = { role: "recipient" };
    const presets = [
      {}, { screen: "create" }, { screen: "create", promptText: U.PROMPT },
      { ...filled }, { ...touched }, { ...touched, modal: "connect", kc: "email" },
      { ...conn, modal: "review" }, { ...conn, modal: "kite" }, { ...conn, modal: "sealing" },
      { ...paid, modal: "ready" },
      { ...paid, ...R, phoneScreen: "chat" }, { ...paid, ...R, phoneScreen: "claim", claim: "sealed" }, { ...paid, ...R, phoneScreen: "claim", claim: "revealed" },
      { ...paid, ...R, phoneScreen: "claim", claim: "revealed", askedAny: true }, { ...paid, ...R, phoneScreen: "claim", claim: "connected", askedAny: true },
      { ...paid, screen: "gifts", claimed: true, toast: true, toastShown: true, phoneScreen: "claim", claim: "claimed" },
    ];
    S = Object.assign(S0(), presets[i], { dev: d });
    U.resetBalances(); if (S.paid) U.spend(S.g.chain, U.need(S.g.amount));
    if (i === 8) { guard(runSealing()); return; }
    render();
    if (i === 15) guard(wait(4500).then(() => { S.toast = false; render(); }));
  }

  /* Scroll only the nearest scroll container (never the phone frame or the canvas) */
  function scrollToEl(el, block = "center") {
    if (!el) return;
    const box = el.closest(".tlist, .ph-body, .desk-scroll, .modal, .kite");
    if (!box) return;
    const r = el.getBoundingClientRect(), cr = box.getBoundingClientRect();
    const k = cr.height / box.clientHeight || 1;
    const delta = block === "start" ? (r.top - cr.top) / k - 12 : (r.top + r.height / 2 - cr.top - cr.height / 2) / k;
    box.scrollTo({ top: box.scrollTop + delta, behavior: "smooth" });
  }

  /* ---------- guide ring ---------- */
  const ring = document.getElementById("ring"), tip = document.getElementById("tip");
  let lastHintKey = "";
  function visible(el, r) {
    const x = r.left + r.width / 2, y = r.top + Math.min(r.height / 2, 12);
    const hit = document.elementFromPoint(x, y);
    return !!hit && (el === hit || el.contains(hit) || hit.contains(el));
  }
  function placeHint() {
    const h = hints ? hintOf() : null;
    const el = h ? (h[0].startsWith("#") ? document.querySelector(h[0]) : $(h[0])) : null;
    if (h && el) {
      const key = h[0] + "|" + S.role + dev();
      if (key !== lastHintKey && !h[0].startsWith("#") && !visible(el, el.getBoundingClientRect())) scrollToEl(el, "center");
      lastHintKey = key;
    }
    const r = el?.getBoundingClientRect();
    if (!el || !r || r.width === 0 || !visible(el, r)) { ring.classList.remove("show"); tip.classList.remove("show"); return requestAnimationFrame(placeHint); }
    const pad = 5;
    ring.style.left = r.left - pad + "px"; ring.style.top = r.top - pad + "px";
    ring.style.width = r.width + pad * 2 + "px"; ring.style.height = r.height + pad * 2 + "px";
    ring.style.borderRadius = Math.min(20, r.height / 2 + pad) + "px";
    ring.classList.add("show");
    tip.textContent = h[1];
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    const below = r.bottom + th + 22 < window.innerHeight - 100;
    tip.className = "show " + (below ? "below" : "above");
    tip.style.left = Math.max(12, Math.min(window.innerWidth - tw - 12, r.left + r.width / 2 - tw / 2)) + "px";
    tip.style.top = (below ? r.bottom + 14 : r.top - th - 14) + "px";
    requestAnimationFrame(placeHint);
  }

  document.fonts.ready.then(() => {
    if (params.get("dev") === "phone") S.dev.sender = "phone";
    if (params.get("rdev") === "desk") S.dev.recipient = "desk";
    const start = +(params.get("step") || 0);
    if (start > 1) jump(start - 1); else render();
    requestAnimationFrame(placeHint);
  });
</script>
</body>
</html>
