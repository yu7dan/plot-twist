/* ---------- router ---------- */
const SCREENS = [["home", "Home"], ["home-menu", "Products menu"], ["home-uses", "Use cases menu"], null, ["gift", "Gift"], ["drop", "Drop"], ["agents", "Agent API"], ["pricing", "Pricing"], null, ["gift-app", "App: Gift"], ["drop-new", "App: New Drop"], ["drop-ready", "App: Drop live"], ["dashboard", "App: Dashboard"]];
function render() {
  const id = (location.hash || "#home").slice(1);
  const html = id === "home-menu" ? P.home("products") : id === "home-uses" ? P.home("uses") : (P[id] || P.home)();
  document.getElementById("root").innerHTML = `<div class="screen desk app glow">${html}</div>`;
  document.getElementById("rbar").innerHTML = SCREENS.map((s) => (s ? `<a href="#${s[0]}" class="${s[0] === id ? "on" : ""}">${s[1]}</a>` : "<i></i>")).join("");
  document.querySelectorAll(".mi[data-menu] > button").forEach((b) => b.addEventListener("click", (e) => {
    const mi = b.parentElement, was = mi.classList.contains("open");
    document.querySelectorAll(".mi.open").forEach((x) => x.classList.remove("open"));
    if (!was) mi.classList.add("open");
    e.stopPropagation();
  }));
  window.scrollTo(0, 0);
}
document.addEventListener("click", (e) => { if (!e.target.closest(".mega")) document.querySelectorAll(".mi.open").forEach((x) => x.classList.remove("open")); });
addEventListener("hashchange", render);
render();
